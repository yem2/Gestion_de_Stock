name: Vérifications

# Se lance à chaque envoi sur main et sur chaque pull request (ex. celles de Codex).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Types, lint, build et sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          APP_URL: http://localhost:3000
      - name: Failles connues (dépendances de production)
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migrations rejouables sur une base vierge
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Appliquer toutes les migrations (première fois)
        run: node scripts/migrate.mjs
      - name: Vérifier qu'il ne reste rien en attente
        run: node scripts/migrate.mjs --check
